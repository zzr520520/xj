name: Build DEB Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid dpkg

      - name: Setup Theos Environment
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS16.5.sdk ~/theos/sdks/ 2>/dev/null || mv sdks-master/*.sdk ~/theos/sdks/
          rm -rf master.zip sdks-master

      - name: Set Permissions & Build
        env:
          THEOS: /Users/runner/theos
        run: |
          # 关键步骤：赋予 maintainer scripts 可执行权限
          chmod 0755 layout/DEBIAN/* || true

          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWiper-Rootless-DEB
          path: packages/*.deb
